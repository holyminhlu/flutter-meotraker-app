services:
  # Flutter Web (Docker + Nginx)
  - type: web
    name: meo-traker-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      # Build-time: URL backend (Render Dashboard → Environment → hoặc Blueprint sync)
      - key: API_BASE_URL
        sync: false

  # Express API (Node)
  - type: web
    name: meo-traker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Ảnh bữa ăn tồn tại qua các lần deploy. Gỡ khối disk nếu dùng object storage.
    disk:
      name: meo-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENROUTER_MODEL
        value: xiaomi/mimo-v2.5
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_SITE_NAME
        value: Meo Traker
      - key: GEMINI_MEAL_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
