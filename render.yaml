services:
  - type: web
    name: meo-traker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Ảnh bữa ăn tồn tại qua các lần deploy. Gỡ khối disk nếu dùng object storage.
    disk:
      name: meo-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENROUTER_MODEL
        value: xiaomi/mimo-v2.5
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_SITE_NAME
        value: Meo Traker
      - key: GEMINI_MEAL_MODEL
        value: gemini-3.5-flash-lite
      # Điền thủ công trong Render Dashboard (sync:false = không đọc từ file).
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
